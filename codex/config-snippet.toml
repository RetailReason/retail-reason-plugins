# Retail Reason — Codex CLI MCP server config.
# Paste into ~/.codex/config.toml (global) or .codex/config.toml (trusted project).
#
# Set your user-bound Retail Reason access key in the environment BEFORE launching Codex.
# Each named user may have two active keys; every key expires within 180 days:
#   export WADV_LICENSE_KEY="wadv_live_..."
#
# The url below is the live Retail Reason production endpoint — paste it as-is. Change it
# only if you are running the service yourself, to http://localhost:8787/mcp

[mcp_servers.walmart_advisor]
url = "https://mcp.retailreason.com/mcp"
bearer_token_env_var = "WADV_LICENSE_KEY"
# Temporary launch setting: the service may use a provider retry plus one guarded regeneration.
tool_timeout_sec = 360
