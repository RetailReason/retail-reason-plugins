# Walmart Advisory Service — Codex CLI MCP server config.
# Paste into ~/.codex/config.toml (global) or .codex/config.toml (trusted project).
#
# Set your seat key in the environment BEFORE launching Codex:
#   export WADV_LICENSE_KEY="wadv_live_..."
#
# Leave the localhost url for local development; swap in the production URL
# when it is provided with your subscription.

[mcp_servers.walmart_advisor]
url = "https://mcp.retailreason.com/mcp"
bearer_token_env_var = "WADV_LICENSE_KEY"
